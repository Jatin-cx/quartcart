<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Sign In — Quartcart</title>
  <meta name="description" content="Sign in to your private Quartcart account to access orders and track allocations.">
  <link rel="canonical" href="/login.html">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ─── Navbar ─────────────────────────────────────────── -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="container flex-between">
      <a href="/index.html" class="navbar-brand">
        <span class="brand-dot"></span>
        Quart<span class="gradient-text">cart</span>
      </a>

      <ul class="nav-links" id="nav-links">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/products.html">All Drops</a></li>
        <li>
          <a href="/cart.html" class="cart-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-2z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span>Bag</span>
            <span class="cart-badge" id="cart-badge">0</span>
          </a>
        </li>
        <li><a href="/login.html" id="nav-account-link" class="active">Sign In</a></li>
        <li style="display:none;"><a href="#" id="nav-logout-btn">Log Out</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <div class="container section" style="padding-top:4rem;">
      <div class="auth-wrapper">
        <div class="badge-tag" style="margin-bottom:1rem;">CLIENT ACCESS</div>
        <h1 style="font-size:1.8rem;margin-bottom:0.35rem;">Sign In to Quartcart</h1>
        <p class="text-muted" style="font-size:0.9rem;margin-bottom:2rem;">Access your allocations, shipping destinations &amp; order history.</p>

        <form id="login-form" novalidate aria-label="Login form">
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="name@domain.com"
              autocomplete="email"
              required
            >
          </div>

          <div class="form-group">
            <div class="flex-between">
              <label for="password" class="form-label">Passcode</label>
              <a href="/forgot-password.html" style="font-size:0.78rem;color:var(--accent-primary);margin-bottom:0.5rem;font-weight:600;">Forgot Passcode?</a>
            </div>
            <div class="password-input-wrapper">
              <input
                type="password"
                id="password"
                class="form-input"
                placeholder="••••••••••••"
                autocomplete="current-password"
                required
              >
              <button type="button" class="password-toggle-btn" aria-label="Toggle passcode visibility" onclick="togglePasswordVisibility('password', this)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg mt-3">
            Sign In →
          </button>
        </form>

        <div style="margin-top:2rem;text-align:center;font-size:0.85rem;color:var(--text-dim);">
          New to Quartcart? <a href="/register.html" style="color:var(--accent-primary);font-weight:600;">Create membership profile →</a>
        </div>
      </div>
    </div>
  </main>

  <!-- ─── Footer ─────────────────────────────────────────── -->
  <footer>
    <div class="container text-center" style="font-size:0.85rem;color:var(--text-dim);">
      <p>© 2026 Quartcart. Powered by Node.js, Mongoose &amp; Stripe.</p>
    </div>
  </footer>

  <div id="toast-container" class="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
